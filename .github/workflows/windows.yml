# Rung 1 + an engine smoke + an end-to-end drive, on Windows with Ubuntu beside it as the control:
# red on both = the runner or the test; red on Windows only = the port. Text-only, a pinned toy
# model, never a real companion's data.
name: windows-harness

on:
  push:
    branches: ["ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rung1:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the ship's bundled runtime is 3.12

      # Informational, never fails: what the product's own prints would do on this console
      # WITHOUT UTF-8 mode. The suite below runs in UTF-8 mode so this cannot hide every result.
      - name: console encoding probe (informational)
        run: python ci/console_encoding_probe.py

      # The port's own claims — red on the pre-port tree on Windows, by design.
      - name: port audit
        run: python ci/port_audit.py

      # The rung-1 suite: an explicit list, never a glob (see the runner's docstring).
      - name: the template renderer the engine ships with (jinja2 comes with llama-cpp-python)
        run: python -m pip install "jinja2>=3,<4" "numpy>=1.26,<3"
      - name: rung 1
        if: always()
        run: python ci/run_rung1.py

  # The one job that loads a brain: a pinned 26.7 MB TOY model (never a being's), through her own
  # loader, on the ship's engine version. Separate job so a wheel problem cannot hide rung 1.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # prebuilt CPU wheel only: a missing wheel fails loudly instead of starting a source build
      - name: install the engine (prebuilt wheel only)
        # quoted: ':all: ' is colon-space, which YAML would read as a new key
        run: "python -m pip install --only-binary=:all: llama-cpp-python==0.3.34 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu"
      - name: smoke — load a toy brain through her loader and generate
        run: python ci/smoke_tiny_gguf.py

  # The end-to-end drive: `python src/veil_game.py` -> create -> wake on the toy
  # brain -> talk -> goodbye -> quit, typed into a real console (ConPTY on Windows, pty on Ubuntu).
  drive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the engine (prebuilt wheel only)
        run: "python -m pip install --only-binary=:all: llama-cpp-python==0.3.34 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu"
      - name: install the pseudo-console (windows only)
        if: runner.os == 'Windows'
        run: "python -m pip install --only-binary=:all: \"pywinpty>=2.0.13,<3\""
      - name: drive — a stranger's first night, end to end
        run: python ci/drive_e2e.py
      - name: keep the transcript (read it word for word)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-transcript-${{ matrix.os }}
          path: ci/.scratch_drive/transcript.txt
          if-no-files-found: warn

  # The download a Windows user gets: embedded Python + the engine wheel + Anchor + Anchor.bat, zipped.
  # Then the same first night is driven through the PACKAGED launcher (it finds the toy brain in models\ on
  # its own — VEIL_MODEL is not set), so a green here means the zip itself works, not just the source tree.
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the Windows zip
        run: python ci/package_windows.py
      - name: install the pseudo-console
        run: "python -m pip install --only-binary=:all: \"pywinpty>=2.0.13,<3\""
      - name: drive the packaged build — a stranger's first night from Anchor.bat
        env:
          ANCHOR_DRIVE_PACKAGE: ${{ github.workspace }}\dist\GlimmerveilAnchor
        run: python ci/drive_e2e.py
      - name: keep the transcript (read it word for word)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-transcript-package
          path: ci/.scratch_drive/transcript.txt
          if-no-files-found: warn
      - name: keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: GlimmerveilAnchor-windows-x64
          path: dist/GlimmerveilAnchor-windows-x64.zip
          if-no-files-found: error

  # The voice download: the same zip plus her voice (Kokoro), her ear (whisper) and PortAudio. A runner has no speakers
  # or mic, so the proof is a LOOPBACK through the zip's own Python: she speaks a line into a file, the ear hears the file,
  # the words must come back. Then the first night is driven with voice present and no device: it must fail soft.
  package-voice:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the Windows voice zip
        run: python ci/package_windows.py --voice
      - name: loopback — her voice into a file, her ear back out, through the packaged Python
        env:
          ANCHOR_SRC: ${{ github.workspace }}\dist\GlimmerveilAnchor\app\src
          VEIL_VOICE_DIR: ${{ github.workspace }}\dist\GlimmerveilAnchor\voice
          VEIL_WHISPER_MODEL: ${{ github.workspace }}\dist\GlimmerveilAnchor\voice\ggml-base.en.bin
          PYTHONUTF8: "1"
        run: dist\GlimmerveilAnchor\python\python.exe ci\voice_loopback.py
      - name: install the pseudo-console
        run: "python -m pip install --only-binary=:all: \"pywinpty>=2.0.13,<3\""
      - name: drive the packaged VOICE build — voice present, no audio device, must fail soft
        env:
          ANCHOR_DRIVE_PACKAGE: ${{ github.workspace }}\dist\GlimmerveilAnchor
        run: python ci/drive_e2e.py
      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-transcript-package-voice
          path: ci/.scratch_drive/transcript.txt
          if-no-files-found: warn
      - name: keep the voice zip
        uses: actions/upload-artifact@v4
        with:
          name: GlimmerveilAnchor-voice-windows-x64
          path: dist/GlimmerveilAnchor-voice-windows-x64.zip
          if-no-files-found: error

  # The Windows Forge = a bake of Anchor: the shell (Forge launcher, its own home, voice) is built here,
  # her brain is added outside CI (ci/forge_add_brain.py). This job adds the toy brain the same way and
  # drives the result, so the shell and the brain step are both proven before a real brain goes in.
  package-forge:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the Forge shell (no brain)
        run: python ci/package_windows.py --forge
      - name: the shell carries no brain, and its launcher points at brain\brain.gguf
        run: python -c "import zipfile; n = zipfile.ZipFile('dist/GlimmerveilForge-shell-windows-x64.zip').namelist(); assert 'GlimmerveilForge/Forge.bat' in n, 'no Forge.bat'; assert not [x for x in n if x.endswith('.gguf')], 'the shell carries a brain'; assert 'brain.gguf' in open('packaging/windows/Forge.bat').read(), 'launcher does not point at the brain'; print('shell ok:', len(n), 'files, no brain')"
      - name: add the toy brain the way her real one goes in
        run: |
          python -c "import sys; sys.path.insert(0, 'ci'); import smoke_tiny_gguf as s; s.fetch()"
          python ci/forge_add_brain.py dist/GlimmerveilForge-shell-windows-x64.zip ci/.scratch_model/stories15M-q8_0.gguf dist/GlimmerveilForge-toy-windows-x64.zip "toy brain for CI"
          python -c "import zipfile; zipfile.ZipFile('dist/GlimmerveilForge-toy-windows-x64.zip').extractall('dist/forge_full')"
      - name: install the pseudo-console
        run: "python -m pip install --only-binary=:all: \"pywinpty>=2.0.13,<3\""
      - name: drive the Forge — her bundled brain, the Forge door, a first night
        env:
          ANCHOR_DRIVE_PACKAGE: ${{ github.workspace }}\dist\forge_full\GlimmerveilForge
          ANCHOR_DRIVE_LAUNCHER: Forge.bat
          ANCHOR_DRIVE_BRAIN: "1"
        run: python ci/drive_e2e.py
      - name: the door said FORGE
        shell: bash
        run: grep -q "G L I M M E R V E I L   F O R G E" ci/.scratch_drive/transcript.txt
      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-transcript-package-forge
          path: ci/.scratch_drive/transcript.txt
          if-no-files-found: warn
      - name: keep the Forge SHELL (no brain; the brain is added off GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: GlimmerveilForge-shell-windows-x64
          path: dist/GlimmerveilForge-shell-windows-x64.zip
          if-no-files-found: error
